[project]
name = "pass-go-backend"
version = "0.1.0"
description = "API for the PassGo event registration platform"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.116,<0.117",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<0.36",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<0.13",
]

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
